<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="title">Games</h1>
      <p class="subtitle">A tiny arcade of web games.</p>
    </header>

    <main class="container">
      <div class="games-grid">
        <a class="game-card" href="/connect-4/">
          <span class="game-chips" aria-hidden="true">
            <span class="chip chip-red"></span>
            <span class="chip chip-yellow"></span>
          </span>
          <span class="game-title">Connect 4</span>
          <span class="game-desc">Drop four in a row. Play a friend locally or online.</span>
          <span class="game-play">Play</span>
        </a>
        <a class="game-card" href="/2048/">
          <span class="game-chips" aria-hidden="true">
            <span class="chip-tile chip-2">2</span>
            <span class="chip-tile chip-4">4</span>
            <span class="chip-tile chip-8">8</span>
          </span>
          <span class="game-title">2048</span>
          <span class="game-desc">Join the tiles, get to 2048! Slide and merge numbers.</span>
          <span class="game-play">Play</span>
        </a>
        <a class="game-card" href="/snake/">
          <span class="game-chips" aria-hidden="true">
            <span class="chip-snake chip-snake-head"></span>
            <span class="chip-snake"></span>
            <span class="chip chip-food"></span>
          </span>
          <span class="game-title">Snake</span>
          <span class="game-desc">Eat, grow, don't bite yourself! Classic snake action.</span>
          <span class="game-play">Play</span>
        </a>
      </div>

      <p class="hub-note">More games coming soon.</p>
      <a class="return-astro" href="https://equipo10.tail7a2703.ts.net:10000/">
        Return to Astro
      </a>
    </main>
  </body>
</html>
